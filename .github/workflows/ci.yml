name: Run Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=." >> $GITHUB_ENV

      # =========================================================
      # INIT DB SCHEMA (NEON SAFE)
      # =========================================================
      - name: Init database schema
        run: |
          python -c "from app.core.database import Base, engine; import app.models.player, app.models.item, app.models.enemy, app.models.quest; Base.metadata.create_all(bind=engine)"

      # =========================================================
      # SEED DATABASE
      # =========================================================
      - name: Seed database
        run: |
          python -c "from app.core.game.seed import seedPlayers, seedShop, seedQuests, seedPlayerQuests; seedPlayers(); seedShop(); seedQuests(); seedPlayerQuests()"

      # =========================================================
      # RUN TESTS
      # =========================================================
      - name: Run tests
        run: pytest --cov=app --cov-report=xml -v

      # =========================================================
      # UPLOAD COVERAGE
      # =========================================================
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false