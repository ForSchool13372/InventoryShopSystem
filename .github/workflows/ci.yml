name: Run Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DATABASE_URL: sqlite:///game.db

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=." >> $GITHUB_ENV

      # =========================================================
      # 1. RESET DATABASE FILE (IMPORTANT FOR SQLITE CLEAN STATE)
      # =========================================================
      - name: Reset database
        run: rm -f game.db

      # =========================================================
      # 2. REBUILD DATABASE SCHEMA
      # =========================================================
      - name: Rebuild DB schema
        run: |
          python -c "from app.core.database import Base, engine; Base.metadata.drop_all(bind=engine); Base.metadata.create_all(bind=engine)"

      # =========================================================
      # 3. SEED DATABASE
      # =========================================================
      - name: Seed database
        run: |
          python -c "from app.core.game.seed import seedPlayers, seedShop, seedQuests, seedPlayerQuests; seedPlayers(); seedShop(); seedQuests(); seedPlayerQuests()"

      # =========================================================
      # 4. RUN TESTS
      # =========================================================
      - name: Run tests
        run: pytest --cov=app --cov-report=xml -v

      # =========================================================
      # 5. COVERAGE
      # =========================================================
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false